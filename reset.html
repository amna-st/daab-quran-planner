<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استعادة كلمة المرور | دَأْب</title>
<style>
body{font-family:Tahoma,Arial;background:#fff4f4;color:#302229;margin:0;padding:20px}
main{max-width:430px;margin:45px auto;background:white;padding:22px;border-radius:20px;border:1px solid #eadde1}
h2{color:#8e4b62}
input{box-sizing:border-box;width:100%;padding:13px;margin:9px 0;border:1px solid #eadde1;border-radius:10px;font:inherit}
button{width:100%;padding:13px;background:#8e4b62;color:white;border:0;border-radius:11px;font:inherit;margin-top:10px}
p{font-size:14px;line-height:1.8}
#message{color:#71384d}
</style>
</head>
<body>
<main>
<h2>دَأْب 🌷</h2>
<h3>استعادة كلمة المرور</h3>
<p id="intro">أدخلي بريدك الإلكتروني وسنرسل ليك رابط تعيين كلمة مرور جديدة.</p>
<form id="requestForm">
<input id="email" type="email" placeholder="البريد الإلكتروني" required>
<button>إرسال رابط الاستعادة</button>
</form>
<form id="updateForm" hidden>
<input id="newPassword" type="password" minlength="6" placeholder="كلمة المرور الجديدة" required>
<input id="confirmPassword" type="password" minlength="6" placeholder="تأكيد كلمة المرور" required>
<button>حفظ كلمة المرور الجديدة</button>
</form>
<p id="message" aria-live="polite"></p>
<a href="./">العودة لتسجيل الدخول</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const client=window.supabase.createClient(
  window.DAAB_CONFIG.supabaseUrl,
  window.DAAB_CONFIG.supabaseAnonKey
);
const requestForm=document.getElementById('requestForm');
const updateForm=document.getElementById('updateForm');
const message=document.getElementById('message');
const intro=document.getElementById('intro');

if(location.hash.includes('type=recovery')){
  requestForm.hidden=true;
  updateForm.hidden=false;
  intro.textContent='أدخلي كلمة المرور الجديدة.';
}

requestForm.addEventListener('submit',async e=>{
  e.preventDefault();
  message.textContent='جاري إرسال الرابط...';
  const email=document.getElementById('email').value.trim();
  const {error}=await client.auth.resetPasswordForEmail(email,{
    redirectTo:location.origin+'/reset.html'
  });
  message.textContent=error?'حصل خطأ: '+error.message:'لو البريد مسجل، حتوصلك رسالة فيها رابط الاستعادة. راجعي الوارد والرسائل غير المرغوب فيها.';
});

updateForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const password=document.getElementById('newPassword').value;
  const confirm=document.getElementById('confirmPassword').value;
  if(password.length<6)return message.textContent='كلمة المرور لازم تكون 6 أحرف على الأقل.';
  if(password!==confirm)return message.textContent='كلمتا المرور ما متطابقتين.';
  message.textContent='جاري تحديث كلمة المرور...';
  const {error}=await client.auth.updateUser({password});
  if(error)return message.textContent='تعذر التحديث: '+error.message;
  message.textContent='اتغيرت كلمة المرور بنجاح 🌷 تقدري ترجعي لتسجيل الدخول.';
  updateForm.hidden=true;
});
</script>
</body>
</html>
